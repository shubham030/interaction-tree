[workspace]
members = [".", "crates/agent-tui", "crates/agent-protocol", "crates/agent-backend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Async
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
async-trait = "0.1"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Utils
anyhow = "1"
tracing = "0.1"

# Workspace crates
agent-protocol = { path = "crates/agent-protocol" }
agent-backend = { path = "crates/agent-backend" }

[package]
name = "it-tui"
version.workspace = true
edition.workspace = true
description = "TUI client for interaction-tree-server monitoring"
license.workspace = true

[[bin]]
name = "it-tui"
path = "src/main.rs"

[lib]
name = "it_tui"
path = "src/lib.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Third-party widgets
tui-tree-widget = "0.23"
throbber-widgets-tui = "0.9"
tui-widgets = "0.5"
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm"] }
tui-menu = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# ANSI parsing
ansi-to-tui = "7"

# Utils
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
terminal-colorsaurus = "1.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
pulldown-cmark = "0.13"
textwrap = "0.16"
arboard = "3"
unicode-width = "0.2.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
insta = { version = "1.42", features = ["yaml"] }
ws-mock = "0.4"
pretty_assertions = "1"
tokio-tungstenite = "0.24"
tungstenite = "0.28"
